<div id="analog-rf-four" aria-label="Tab5 アナログ4ch監視の操作できる画面案">
  <style>
    #analog-rf-four { --rf-bg: light-dark(#f3f6fa,#101827); --rf-panel: light-dark(#ffffff,#182439); --rf-text: light-dark(#172438,#edf4ff); --rf-dim: light-dark(#4c6076,#aabbd0); --rf-grid: light-dark(#ccd5df,#35465e); --rf-c1: light-dark(#0078a8,#52c8ff); --rf-c2: light-dark(#137d64,#49dcb1); --rf-c3: light-dark(#996000,#f3ba61); --rf-c4: light-dark(#7651b9,#ba9bff); --rf-warn: light-dark(#895b00,#f3ba61); --rf-bad: light-dark(#ae2539,#ff8e9b); color:var(--rf-text); background:var(--rf-bg); border-radius:16px; padding:18px; font:14px/1.45 system-ui,sans-serif; box-sizing:border-box; }
    #analog-rf-four * { box-sizing:border-box; }
    #analog-rf-four .rf-head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding-right:92px; margin-bottom:14px; }
    #analog-rf-four .rf-title { font-size:19px; font-weight:500; }
    #analog-rf-four .rf-sub { color:var(--rf-dim); font-size:12px; }
    #analog-rf-four .rf-tag { display:inline-block; border:1px solid var(--rf-grid); padding:3px 9px; border-radius:6px; font-size:12px; color:var(--rf-dim); }
    #analog-rf-four .rf-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
    #analog-rf-four button, #analog-rf-four select { font:inherit; color:var(--rf-text); background:var(--rf-panel); border:1px solid var(--rf-grid); border-radius:7px; padding:9px 12px; min-height:42px; }
    #analog-rf-four button[aria-pressed="true"] { border-color:var(--rf-text); font-weight:500; }
    #analog-rf-four .rf-scene-label { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-left:auto; }
    #analog-rf-four select { max-width:100%; }
    #analog-rf-four .rf-status { padding:10px 0; border-top:1px solid var(--rf-grid); border-bottom:1px solid var(--rf-grid); margin-bottom:14px; font-weight:500; }
    #analog-rf-four .rf-cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    #analog-rf-four .rf-channel { padding:10px; border-radius:10px; background:var(--rf-panel); min-width:0; }
    #analog-rf-four .rf-channel-head { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
    #analog-rf-four .rf-name { font-size:21px; font-weight:500; }
    #analog-rf-four .rf-freq { font-size:12px; color:var(--rf-dim); }
    #analog-rf-four .rf-value { font-variant-numeric:tabular-nums; font-size:28px; margin:7px 0 3px; white-space:nowrap; }
    #analog-rf-four .rf-value small { font-size:12px; color:var(--rf-dim); }
    #analog-rf-four .rf-track { height:7px; background:var(--rf-grid); margin:9px 0; border-radius:4px; overflow:hidden; }
    #analog-rf-four .rf-fill { height:100%; background:var(--series); }
    #analog-rf-four .rf-state { min-height:28px; font-size:12px; overflow-wrap:anywhere; }
    #analog-rf-four .rf-plan { display:flex; gap:7px; align-items:center; font-size:12px; min-height:32px; }
    #analog-rf-four input[type="checkbox"] { accent-color:var(--rf-c1); width:17px; height:17px; }
    #analog-rf-four .rf-chart-head { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin:12px 0 5px; }
    #analog-rf-four .rf-legend { display:flex; flex-wrap:wrap; gap:13px; color:var(--rf-dim); font-size:12px; }
    #analog-rf-four .rf-legend i { display:inline-block; width:16px; height:3px; vertical-align:middle; margin-right:5px; }
    #analog-rf-four canvas { display:block; width:100%; height:190px; }
    #analog-rf-four .rf-waterfall { height:129px; }
    #analog-rf-four .rf-event { margin-top:12px; padding:10px 12px; background:var(--rf-panel); border-radius:8px; overflow-wrap:anywhere; }
    #analog-rf-four .rf-event-title { font-weight:500; margin-bottom:3px; }
    #analog-rf-four .rf-event-detail { font-size:12px; color:var(--rf-dim); }
    #analog-rf-four .rf-footer { color:var(--rf-dim); font-size:12px; display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:12px; }
    #analog-rf-four [hidden] { display:none !important; }
    #analog-rf-four .rf-warn { color:var(--rf-warn); }
    #analog-rf-four .rf-bad { color:var(--rf-bad); }
    @media(max-width:680px) { #analog-rf-four { padding:13px; } #analog-rf-four .rf-cards { grid-template-columns:repeat(2,minmax(0,1fr)); } #analog-rf-four .rf-scene-label { margin-left:0; width:100%; } #analog-rf-four .rf-scene-label select { flex:1; min-width:0; } #analog-rf-four .rf-value { font-size:25px; } #analog-rf-four .rf-head { padding-right:0; } }
    @media(pointer:coarse) { #analog-rf-four button, #analog-rf-four select, #analog-rf-four .rf-plan { min-height:44px; } }
  </style>
  <header class="rf-head">
    <div><div class="rf-title">FPV FIELD MONITOR</div><div class="rf-sub">アナログ4ch / E2・E1・F3・F5</div></div>
    <div><span class="rf-tag">画面案・模擬データ</span></div>
  </header>
  <div class="rf-tools">
    <button type="button" data-view="monitor" aria-pressed="true">4ch監視</button>
    <button type="button" data-view="survey" aria-pressed="false">広域サーチ</button>
    <label class="rf-scene-label">模擬シーン
      <select id="rf-scene">
        <option value="normal">通常の4台</option>
        <option value="extra">送信予定のないF5に上昇</option>
        <option value="between">4chの間に別の山</option>
        <option value="image">E2だけON・E1も上昇</option>
        <option value="imd">2波同時で別の山</option>
        <option value="clip">強入力で測定が飽和</option>
      </select>
    </label>
  </div>
  <div class="rf-status" id="rf-status" aria-live="polite"></div>
  <section id="rf-monitor" aria-label="4チャンネルの受信変化">
    <div class="rf-cards" id="rf-cards"></div>
    <div class="rf-chart-head"><span>受信変化 / 基準比 dB</span><div class="rf-legend" id="rf-channel-legend"></div></div>
    <canvas id="rf-history" role="img" aria-label="4chの60秒間の受信履歴。模擬データ。">4chの受信履歴</canvas>
    <div class="rf-event"><div class="rf-event-title" id="rf-event-title"></div><div class="rf-event-detail" id="rf-event-detail"></div></div>
  </section>
  <section id="rf-survey" aria-label="広い周波数範囲の走査" hidden>
    <div class="rf-chart-head"><span>走査受信レベル / 基準比 dB</span><label class="rf-plan"><input type="checkbox" id="rf-show-imd">予定ONのIMD計算候補</label></div>
    <div class="rf-legend"><span>実測を想定した模式曲線</span><span>背景比 0 dB</span><span id="rf-imd-key" hidden>破線＝周波数の計算候補・未実測</span></div>
    <canvas id="rf-spectrum" role="img" aria-label="5645から5917MHzの走査受信レベルの模式図。模擬データ。">周波数ごとの受信変化</canvas>
    <div class="rf-chart-head"><span>ウォーターフォール / 模擬30秒</span><span class="rf-sub">濃淡＝受信上昇</span></div>
    <canvas class="rf-waterfall" id="rf-waterfall" role="img" aria-label="周波数と時間で受信上昇を見る模式図。模擬データ。">時間と周波数ごとの受信変化</canvas>
    <div class="rf-event"><div class="rf-event-title" id="rf-survey-title"></div><div class="rf-event-detail" id="rf-survey-detail"></div></div>
  </section>
  <footer class="rf-footer"><span>背景：模擬記録あり / 相対値</span><span>映像品質・送信者・故障は未判定</span><span id="rf-coverage"></span></footer>
  <script>
    (() => {
      const root=document.getElementById('analog-rf-four');
      const q=s=>root.querySelector(s);
      const channels=[['E2',5685],['E1',5705],['F3',5780],['F5',5820]];
      const scenes={
        normal:{plan:[true,true,true,true],tones:[[5685,23],[5705,21],[5780,19],[5820,21]],event:'4chで受信あり',detail:'受信の強さだけでは、映像が正常か・混信がないかは判定しません。',survey:'予定した4つの帯域を比較',surveyDetail:'背景と、1台ずつ記録した正常時の形を重ねて変化を確認します。'},
        extra:{plan:[true,true,true,false],tones:[[5685,23],[5705,21],[5780,19],[5820,18]],event:'F5：送信予定なしで受信上昇',detail:'予定機を全てOFFにしても残るか確認。送信元と原因は未特定です。',survey:'F5付近にも受信の山',surveyDetail:'周波数が一致しても、送信者や不良VTXはこの測定だけで断定しません。'},
        between:{plan:[false,false,false,false],tones:[[5748,20]],event:'4chの中心付近は基準と同程度',detail:'チャンネル間と外側は未観測です。広域サーチで確認します。',survey:'5748 MHz付近：背景にない山',surveyDetail:'4つの中心だけの監視では見逃す例。中心周波数は模式図の設定値です。'},
        image:{plan:[true,false,false,false],tones:[[5685,30],[5705,12]],event:'E1にも上昇：E2の写り込みを要確認',detail:'E2をOFFにして比較し、必要ならLOを変えて再取得します。別送信とは断定しません。',survey:'E2とE1に山：像を切り分け',surveyDetail:'この模擬シーンは受信機のイメージを含みます。18 dBを固定で引く補正は行いません。'},
        imd:{plan:[true,true,false,false],tones:[[5685,23],[5705,22],[5665,8],[5725,8]],event:'4chの中心だけでは別の山を見逃す場合',detail:'広域サーチに切り替え、1台ずつONにした記録と比較します。',survey:'2波同時のときに別の山が出る例',surveyDetail:'5665 / 5725 MHzは計算候補にも一致。受信機内の歪みも含めて切り分け、IMDと即断しません。'},
        clip:{plan:[true,true,true,true],tones:[],event:'測定注意：ADC飽和',detail:'受信入力またはゲインを下げて再確認。現在値を正常な受信レベルとして表示しません。',survey:'測定飽和のため判定できません',surveyDetail:'強入力では測定器自身が歪むことがあります。曲線を正常値として描画しません。'}
      };
      const saved=window.openai?.widgetState?.privateContent;
      const state={scene:scenes[saved?.scene]?saved.scene:'normal',view:saved?.view==='survey'?'survey':'monitor',showImd:!!saved?.showImd,plans:Array.isArray(saved?.plans)&&saved.plans.length===4&&saved.plans.every(v=>typeof v==='boolean')?[...saved.plans]:null};
      const settings={historySeconds:60};
      function remember(){window.openai?.setWidgetState?.({modelContent:{scene:state.scene,view:state.view,simulation:true,plannedOn:channels.filter((_,i)=>state.plans[i]).map(c=>c[0])},privateContent:{scene:state.scene,view:state.view,showImd:state.showImd,plans:[...state.plans]}})?.catch(()=>{});}
      function colors(){const probe=document.createElement('span');root.appendChild(probe);const result={};for(const k of ['bg','text','dim','grid','c1','c2','c3','c4','warn','bad']){probe.style.color='var(--rf-'+k+')';result[k]=getComputedStyle(probe).color;}probe.remove();return result;}
      function powerAt(f,tones){return 1+tones.reduce((sum,[fc,db])=>sum+(Math.pow(10,db/10)-1)*Math.exp(-Math.pow((f-fc)/8,4)),0);}
      function levelAt(f,tones){return 10*Math.log10(powerAt(f,tones));}
      function initCanvas(id){const canvas=q(id),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,rect.width,rect.height);return {c,w:rect.width,h:rect.height,p:colors()};}
      function axes(o,opts){const {c,w,h,p}=o,L=w<450?38:43,R=14,T=29,B=31;const box={x:L,y:T,w:w-L-R,h:h-T-B};c.font='12px system-ui';c.lineWidth=1;c.textAlign='right';c.textBaseline='middle';for(const v of [0,10,20,30]){const y=box.y+box.h*(1-v/35);c.strokeStyle=p.grid;c.beginPath();c.moveTo(box.x,y);c.lineTo(box.x+box.w,y);c.stroke();c.fillStyle=p.dim;c.fillText(String(v),box.x-7,y);}c.textAlign='center';for(const [f,label] of opts.ticks){const x=box.x+box.w*(f-opts.lo)/(opts.hi-opts.lo);c.fillStyle=p.dim;const half=c.measureText(label).width/2;c.fillText(label,Math.max(half+2,Math.min(w-half-2,x)),h-12);}return box;}
      function drawHistory(){const o=initCanvas('#rf-history'),{c,p}=o,seconds=settings.historySeconds,b=axes(o,{lo:-seconds,hi:0,ticks:[[-seconds,'−'+seconds+'秒'],[-seconds/2,'−'+seconds/2], [0,'今']]});if(state.scene==='clip'){c.fillStyle=p.bad;c.textAlign='center';c.fillText('飽和：有効な受信レベルなし',b.x+b.w/2,b.y+b.h/2);return;}const data=scenes[state.scene];channels.forEach(([name,f],i)=>{c.strokeStyle=p['c'+(i+1)];c.lineWidth=2;c.beginPath();for(let t=0;t<=120;t++){const sec=-seconds+t*seconds/120,fade=state.scene==='extra'&&i===3?(sec<-15?0:1):1;let db=levelAt(f,data.tones)*fade+0.18*Math.sin(t*.47+i);db=Math.max(0,db);const x=b.x+b.w*t/120,y=b.y+b.h*(1-db/35);if(t===0)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();});}
      function candidates(){const active=channels.filter((_,i)=>state.plans[i]),out=new Set();for(const a of active)for(const b of active)if(a!==b)out.add(2*a[1]-b[1]);for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++)for(let k=0;k<active.length;k++)if(k!==i&&k!==j)out.add(active[i][1]+active[j][1]-active[k][1]);return [...out].filter(f=>f>=5645&&f<=5917).sort((a,b)=>a-b);}
      function drawSpectrum(){const o=initCanvas('#rf-spectrum'),{c,p}=o,b=axes(o,{lo:5645,hi:5917,ticks:[[5645,'5645'],[5780,'5780'],[5917,'5917 MHz']]});const X=f=>b.x+b.w*(f-5645)/272;if(state.scene==='clip'){c.fillStyle=p.bad;c.textAlign='center';c.fillText('飽和：スペクトラム判定を保留',b.x+b.w/2,b.y+b.h/2);return;}channels.forEach(([name,f])=>{const x=X(f);c.strokeStyle=p.grid;c.beginPath();c.moveTo(x,b.y);c.lineTo(x,b.y+b.h);c.stroke();c.fillStyle=p.dim;c.textAlign='center';c.fillText(name,x,b.y-12);});if(state.showImd){c.save();c.setLineDash([3,4]);c.strokeStyle=p.warn;for(const f of candidates()){const x=X(f);c.beginPath();c.moveTo(x,b.y+5);c.lineTo(x,b.y+b.h);c.stroke();}c.restore();}c.beginPath();c.lineWidth=2;c.strokeStyle=p.c1;for(let f=5645;f<=5917;f++){const x=X(f),db=levelAt(f,scenes[state.scene].tones),y=b.y+b.h*(1-db/35);if(f===5645)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();}
      function drawWaterfall(){const o=initCanvas('#rf-waterfall'),{c,w,h,p}=o,L=43,T=8,B=26,W=w-L-14,H=h-T-B;const base=p.bg,hot=p.c1;c.font='12px system-ui';if(state.scene==='clip'){c.fillStyle=p.bad;c.textAlign='center';c.fillText('有効データなし',w/2,h/2);return;}const cols=Math.max(48,Math.floor(W/3)),rows=25;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const f=5645+272*x/(cols-1);let db=levelAt(f,scenes[state.scene].tones);if(state.scene==='between'&&y<10)db=0;if(state.scene==='extra'&&y<13&&Math.abs(f-5820)<15)db=0;c.fillStyle=base;c.fillRect(L+x*W/cols,T+y*H/rows,W/cols+1,H/rows+1);c.globalAlpha=Math.min(.95,Math.max(.025,db/33));c.fillStyle=hot;c.fillRect(L+x*W/cols,T+y*H/rows,W/cols+1,H/rows+1);}c.globalAlpha=1;c.fillStyle=p.dim;c.textAlign='right';c.fillText('−30秒',L-4,T+7);c.fillText('今',L-4,T+H-3);c.textAlign='center';c.fillText('5645',L,h-7);c.fillText('5780',L+W*.5,h-7);c.fillText('5917 MHz',L+W-20,h-7);}
      function drawAll(){if(state.view==='monitor')drawHistory();else {drawSpectrum();drawWaterfall();}}
      function render(resetPlans=false){const data=scenes[state.scene];if(resetPlans||!state.plans)state.plans=[...data.plan];q('#rf-scene').value=state.scene;q('#rf-show-imd').checked=state.showImd;q('#rf-monitor').hidden=state.view!=='monitor';q('#rf-survey').hidden=state.view!=='survey';q('#rf-imd-key').hidden=!state.showImd;root.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===state.view)));q('#rf-cards').replaceChildren();channels.forEach(([name,f],i)=>{const db=levelAt(f,data.tones),warn=!state.plans[i]&&db>=6,card=document.createElement('div');card.className='rf-channel';card.style.setProperty('--series','var(--rf-c'+(i+1)+')');card.innerHTML='<div class="rf-channel-head"><span class="rf-name">'+name+'</span><span class="rf-freq">'+f+' MHz</span></div><div class="rf-value">'+(state.scene==='clip'?'—':'+'+db.toFixed(1))+' <small>基準比 dB</small></div><div class="rf-track"><div class="rf-fill" style="width:'+(state.scene==='clip'?0:Math.min(100,db/35*100))+'%"></div></div><div class="rf-state'+(warn?' rf-warn':'')+(state.scene==='clip'?' rf-bad':'')+'">'+(state.scene==='clip'?'測定無効・CLIP':warn?'予定なし・受信上昇':db>=6?'受信あり':'基準付近')+'</div>';const label=document.createElement('label');label.className='rf-plan';const input=document.createElement('input');input.type='checkbox';input.checked=state.plans[i];input.setAttribute('aria-label',name+'の送信予定ON');input.onchange=()=>{state.plans[i]=input.checked;render();remember();};label.append(input,document.createTextNode('送信予定ON'));card.append(label);q('#rf-cards').append(card);});q('#rf-channel-legend').innerHTML=channels.map(([n],i)=>'<span><i style="background:var(--rf-c'+(i+1)+')"></i>'+n+'</span>').join('');const unexpected=channels.filter(([,f],i)=>!state.plans[i]&&levelAt(f,data.tones)>=6).map(([n])=>n);q('#rf-status').textContent=state.scene==='clip'?'測定注意：入力飽和 / 判定保留':state.view==='survey'?'広域サーチ中 / 4chの連続監視は一時停止':unexpected.length?'要確認：'+unexpected.join('・')+'に送信予定外の受信上昇':'4ch監視 / '+(state.scene==='between'?'中心付近は基準と同程度':'受信の変化を表示');q('#rf-event-title').textContent=data.event;q('#rf-event-detail').textContent=data.detail;q('#rf-survey-title').textContent=data.survey;q('#rf-survey-detail').textContent=data.surveyDetail;q('#rf-coverage').textContent=state.view==='monitor'?'4chの外側・間の周波数は未観測':'粗走査の画面案 / 2 MHzステップ ≠ 2 MHz分解能';drawAll();}
      q('#rf-scene').onchange=e=>{state.scene=e.target.value;render(true);remember();};root.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;render();remember();});q('#rf-show-imd').onchange=e=>{state.showImd=e.target.checked;render();remember();};
      new ResizeObserver(()=>drawAll()).observe(root);
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawAll());
      window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(!s)return;if(scenes[s.scene])state.scene=s.scene;state.view=s.view==='survey'?'survey':'monitor';state.showImd=!!s.showImd;state.plans=Array.isArray(s.plans)&&s.plans.length===4&&s.plans.every(v=>typeof v==='boolean')?[...s.plans]:null;render();});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:drawAll});tweak.addSlider(settings,'historySeconds',{label:'履歴の長さ',min:20,max:120,step:10,unit:'秒'});}
    })();
  </script>
</div>
