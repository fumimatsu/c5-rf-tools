name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pyramid:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r apps/pyramid/requirements.txt
      - run: python -m unittest -v test_protocol test_recording test_portability
        working-directory: apps/pyramid
      - run: node --check apps/pyramid/ui.js
