name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pyramid:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: python -m pip install -r apps/pyramid/requirements.txt
      - run: python -m unittest -v test_protocol test_recording test_portability test_scanner test_scanner_http
        working-directory: apps/pyramid
      - run: node --check apps/pyramid/ui.js
      - run: node --check apps/pyramid/labels-ui.js
